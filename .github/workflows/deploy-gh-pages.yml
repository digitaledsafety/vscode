name: Deploy Static VS Code to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install build tool dependencies
        run: pnpm -C build install --ignore-scripts

      - name: Build static site
        env:
          VSCODE_STATIC_CNAME: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$VSCODE_STATIC_CNAME" ]; then
            export VSCODE_STATIC_BASE_URL="/"
          else
            export VSCODE_STATIC_BASE_URL="/${{ github.event.repository.name }}"
          fi
          pnpm run build-static-min

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
