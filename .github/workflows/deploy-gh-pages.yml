name: Deploy Static VS Code to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install build tool dependencies
        run: pnpm -C build install --ignore-scripts

      - name: Determine Pages custom domain
        id: pages-domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGES_CNAME=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(data);
                console.log(parsed.cname || "");
              } catch {
                console.log("");
              }
            });
          ')
          echo "cname=$PAGES_CNAME" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          PAGES_CUSTOM_DOMAIN: ${{ steps.pages-domain.outputs.cname }}
          VSCODE_STATIC_CNAME: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          CNAME_TARGET="${PAGES_CUSTOM_DOMAIN:-$VSCODE_STATIC_CNAME}"
          if [ -z "$CNAME_TARGET" ] && [ -f "CNAME" ]; then
            CNAME_TARGET=$(cat CNAME | tr -d '[:space:]')
          fi

          if [ -n "$CNAME_TARGET" ]; then
            export VSCODE_STATIC_CNAME="$CNAME_TARGET"
            export VSCODE_STATIC_BASE_URL=""
          else
            export VSCODE_STATIC_BASE_URL="/${{ github.event.repository.name }}"
          fi
          pnpm run build-static-min

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
